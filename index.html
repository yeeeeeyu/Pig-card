<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff1f5">
<title>小豬幫幫我！</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fff1f5;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif}body{display:flex;justify-content:center}.page{position:relative;width:min(100vw,430px);aspect-ratio:1024/1466;background:#fff1f5 url("mockup.jpg") center top/100% 100% no-repeat;overflow:hidden}.tap{position:absolute;border:0;background:transparent;padding:0;cursor:pointer}.manage{left:73.2%;top:2.2%;width:23.2%;height:6.2%}.quick1{left:7.4%;top:36.8%;width:42%;height:8.2%}.quick5{left:51.2%;top:36.8%;width:42%;height:8.2%}.customInput{position:absolute;left:8.1%;top:51.8%;width:66.5%;height:6.1%;border:0;outline:0;background:rgba(255,255,255,.02);font-size:clamp(13px,4vw,17px);color:#6b3947;padding:0 14px;border-radius:18px}.customInput::placeholder{color:#aaa;opacity:1}.useBtn{left:76.7%;top:51.8%;width:16.7%;height:6.1%}.addBtn{left:6.8%;top:61.0%;width:43%;height:6.2%}.undoBtn{left:51.2%;top:61.0%;width:43%;height:6.2%}.levelArea,.encourageArea{pointer-events:none}.balanceCover{position:absolute;left:9%;top:24.2%;width:27%;height:9.2%;background:linear-gradient(145deg,#ffb9ca,#ff9eb8);border-radius:8px;opacity:.98}.balance{position:absolute;left:10.2%;top:24.4%;font-size:clamp(34px,10vw,49px);font-weight:950;color:#fff;text-shadow:0 3px 0 rgba(185,78,109,.18);z-index:2}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(15px);background:#593d45;color:#fff;padding:11px 16px;border-radius:14px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:20;white-space:nowrap}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.modal{display:none;position:fixed;inset:0;background:rgba(107,57,71,.32);backdrop-filter:blur(5px);align-items:flex-end;justify-content:center;padding:14px;z-index:30}.modal.show{display:flex}.sheet{width:min(430px,100%);background:linear-gradient(#fffafb,#fff);border:2px solid #f8dce5;border-radius:30px;padding:22px;box-shadow:0 -10px 35px rgba(62,40,53,.15)}.sheet h2{margin:4px 0 6px;color:#6b3947}.sheet p{margin:0 0 14px;color:#9b6573;font-size:13px}.input{width:100%;padding:14px;border:2px solid #f0d5de;border-radius:17px;font-size:18px;outline:0;background:#fffafb}.confirm,.cancel{width:100%;border:0;border-radius:16px;padding:14px;font-size:16px;font-weight:900;margin-top:10px}.confirm{background:#ff6f98;color:#fff}.cancel{background:#f7eef1;color:#593d45}.adminTools{display:none;position:absolute;left:6.8%;top:61%;width:86.5%;height:6.2%;z-index:5}.adminTools.show{display:block}.hint{position:absolute;left:6%;top:68%;width:88%;text-align:center;font-size:10px;color:#9b6573;opacity:.55}
@media(min-width:700px){body{padding:20px 0}.page{box-shadow:0 20px 60px rgba(150,80,100,.12);border-radius:28px}}
</style>
</head>
<body>
<div class="page" id="page">
  <button class="tap manage" onclick="openPin()" aria-label="豬豬管理"></button>
  <button class="tap quick1" onclick="spend(1)" aria-label="使用1枚印章"></button>
  <button class="tap quick5" onclick="spend(5)" aria-label="使用5枚印章"></button>
  <input id="publicSpend" class="customInput" type="number" min="1" step="1" inputmode="numeric" placeholder="輸入要使用幾枚印章" aria-label="輸入要使用幾枚印章">
  <button class="tap useBtn" onclick="publicSpend()" aria-label="使用印章"></button>
  <button class="tap addBtn" onclick="openMoney('add')" aria-label="補充印章"></button>
  <button class="tap undoBtn" onclick="undo()" aria-label="取消上一個"></button>
  <div class="balanceCover"></div><div class="balance" id="balance">850</div>
</div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="sheet"><h2 id="mt">🔐 豬豬管理</h2><p id="mp">請輸入管理密碼</p><input id="input" class="input" type="password" placeholder="輸入密碼"><button class="confirm" onclick="confirmModal()">確認</button><button class="cancel" onclick="closeModal()">取消</button></div></div>
<script>
const card=new URLSearchParams(location.search).get('card')||'001';
const key='pig_'+card;
const ADMIN_PIN='smallpig0926';
let data=JSON.parse(localStorage.getItem(key)||'null')||{name:'大豬',balance:850,history:[]};
let mode='pin',moneyMode='add';
function save(){localStorage.setItem(key,JSON.stringify(data));render()}
function render(){document.getElementById('balance').textContent=Number(data.balance).toLocaleString('zh-TW')}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1600)}
function spend(n){if(n>data.balance)return toast('乖豬豬印章不夠喔 🐷');data.history.push(data.balance);data.balance-=n;save();toast('已使用 '+n+' 枚印章 🐷')}
function publicSpend(){const e=document.getElementById('publicSpend');const n=Math.floor(Number(e.value));if(!n||n<1)return toast('請輸入要使用的印章數');if(n>data.balance)return toast('乖豬豬印章不夠喔 🐷');data.history.push(data.balance);data.balance-=n;save();e.value='';toast('已使用 '+n+' 枚印章 🐷')}
function undo(){if(!data.history.length)return toast('目前沒有可以取消的操作');data.balance=data.history.pop();save();toast('已取消上一個操作 ↩️')}
function openPin(){mode='pin';document.getElementById('mt').textContent='🔐 豬豬管理';document.getElementById('mp').textContent='請輸入管理密碼';const i=document.getElementById('input');i.type='password';i.value='';i.placeholder='輸入密碼';document.getElementById('modal').classList.add('show');setTimeout(()=>i.focus(),80)}
function openMoney(m){moneyMode=m;mode='money';document.getElementById('mt').textContent=m==='add'?'💗 補充印章':'🐾 使用印章';document.getElementById('mp').textContent=m==='add'?'輸入要補充的印章數':'輸入要使用的印章數';const i=document.getElementById('input');i.type='number';i.inputMode='numeric';i.value='';i.placeholder=m==='add'?'輸入要補充幾枚印章':'輸入要使用幾枚印章';document.getElementById('modal').classList.add('show');setTimeout(()=>i.focus(),80)}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function confirmModal(){const i=document.getElementById('input');if(mode==='pin'){if(i.value===ADMIN_PIN){closeModal();toast('管理驗證成功 🔓');openMoney('add')}else toast('密碼錯誤，再試一次');return}const n=Math.floor(Number(i.value));if(!n||n<1)return toast('請輸入正確數量');if(moneyMode==='spend'&&n>data.balance)return toast('乖豬豬印章不夠喔 🐷');if(moneyMode==='add'){data.history.push(data.balance);data.balance+=n}else{data.history.push(data.balance);data.balance-=n}save();closeModal();toast(moneyMode==='add'?'印章補充成功 💗':'印章使用成功 🐷')}
render();
</script>
</body></html>
