<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff1f5">
<title>小豬幫幫我！</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff1f5;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif}
body{display:flex;justify-content:center}
.page{position:relative;width:min(100vw,430px);aspect-ratio:1024/1536;background:#fff1f5 url("mockup.jpg") center top/100% 100% no-repeat;overflow:hidden}
.tap{position:absolute;border:0;background:transparent;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tap:focus-visible{outline:3px solid rgba(235,91,135,.65);outline-offset:2px;border-radius:18px}
.manage{left:73%;top:6.3%;width:24%;height:5.8%}
.quick1{left:7.2%;top:48.6%;width:42%;height:7.2%}
.quick5{left:51.1%;top:48.6%;width:42%;height:7.2%}
.customInput{position:absolute;left:8%;top:64.25%;width:66.2%;height:5.7%;border:0;outline:0;background:rgba(255,255,255,.72);font-size:clamp(14px,4vw,17px);font-weight:600;color:#6b3947;padding:0 14px;border-radius:18px;text-align:left}
.customInput::placeholder{color:#aaa;opacity:1}
.useBtn{left:76.8%;top:64.25%;width:16.2%;height:5.7%}
.addBtn{left:6.8%;top:72.8%;width:43%;height:5.9%}
.undoBtn{left:51.1%;top:72.8%;width:43%;height:5.9%}
/* Cover only the static $0 in the reference image so the real balance can update. */
.balanceCover{position:absolute;left:7%;top:21.5%;width:30%;height:10%;background:linear-gradient(145deg,#ffb6c8,#ff9eb8);border-radius:12px;z-index:2}
.balance{position:absolute;left:9.5%;top:22%;width:28%;font-size:clamp(42px,11vw,58px);line-height:1;font-weight:950;color:#fff;text-shadow:0 3px 0 rgba(185,78,109,.18);z-index:3;white-space:nowrap}
.levelDynamic{position:absolute;left:17.8%;top:85.4%;width:28%;z-index:3;color:#6b3947;text-align:left;pointer-events:none}
.levelDynamic .name{font-size:clamp(16px,4.2vw,20px);font-weight:900;line-height:1.2}
.levelDynamic .range{font-size:clamp(11px,3vw,14px);margin-top:5px;color:#8f5d6b}
.encDynamic{position:absolute;left:58%;top:85.8%;width:34%;z-index:3;color:#6b3947;pointer-events:none;font-size:clamp(12px,3.1vw,15px);line-height:1.45;font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(15px);background:#593d45;color:#fff;padding:11px 16px;border-radius:14px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{display:none;position:fixed;inset:0;background:rgba(107,57,71,.32);backdrop-filter:blur(5px);align-items:flex-end;justify-content:center;padding:14px;z-index:60}
.modal.show{display:flex}
.sheet{width:min(430px,100%);background:linear-gradient(#fffafb,#fff);border:2px solid #f8dce5;border-radius:30px;padding:22px;box-shadow:0 -10px 35px rgba(62,40,53,.15)}
.sheet h2{margin:4px 0 6px;color:#6b3947}.sheet p{margin:0 0 14px;color:#9b6573;font-size:13px}
.input{width:100%;padding:14px;border:2px solid #f0d5de;border-radius:17px;font-size:18px;outline:0;background:#fffafb}
.confirm,.cancel{width:100%;border:0;border-radius:16px;padding:14px;font-size:16px;font-weight:900;margin-top:10px}.confirm{background:#ff6f98;color:#fff}.cancel{background:#f7eef1;color:#593d45}
@media(min-width:700px){body{padding:20px 0}.page{box-shadow:0 20px 60px rgba(150,80,100,.12);border-radius:28px}}
</style>
</head>
<body>
<div class="page" id="page" aria-label="小豬幫幫我">
  <button class="tap manage" id="manage" aria-label="豬豬管理" type="button"></button>
  <button class="tap quick1" id="quick1" aria-label="使用1枚印章" type="button"></button>
  <button class="tap quick5" id="quick5" aria-label="使用5枚印章" type="button"></button>
  <input id="publicSpend" class="customInput" type="number" min="1" step="1" inputmode="numeric" placeholder="輸入要使用幾枚印章" aria-label="輸入要使用幾枚印章">
  <button class="tap useBtn" id="useBtn" aria-label="使用印章" type="button"></button>
  <button class="tap addBtn" id="addBtn" aria-label="補充印章" type="button"></button>
  <button class="tap undoBtn" id="undoBtn" aria-label="取消上一個" type="button"></button>

  <div class="balanceCover" aria-hidden="true"></div>
  <div class="balance" id="balance" aria-live="polite">850</div>
  <div class="levelDynamic" aria-live="polite"><div class="name" id="levelName">🐣 小乖豬</div><div class="range" id="levelRange">0 - 9 枚</div></div>
  <div class="encDynamic" id="encouragement" aria-live="polite">大豬今天也很乖！<br>繼續保持喔～</div>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
  <div class="sheet">
    <h2 id="mt">🔐 豬豬管理</h2>
    <p id="mp">請輸入管理密碼</p>
    <input id="modalInput" class="input" type="password" placeholder="輸入密碼" autocomplete="off">
    <button class="confirm" id="confirm" type="button">確認</button>
    <button class="cancel" id="cancel" type="button">取消</button>
  </div>
</div>
<script>
(function(){
  const card=new URLSearchParams(location.search).get('card')||'001';
  const key='pig_'+card;
  const ADMIN_PIN='smallpig0926';
  const encouragements=['🐷 大豬今天也很乖！','💕 大豬乖乖，繼續保持！','🎀 這枚印章是給乖乖的大豬！','✨ 大豬表現得很好喔！','🐽 乖豬豬認證成功！','💗 大豬又完成一件乖乖的事了！'];
  let data;
  try{data=JSON.parse(localStorage.getItem(key)||'null')}catch(e){data=null}
  if(!data || typeof data.balance!=='number') data={name:'大豬',balance:850,history:[]};
  if(!Array.isArray(data.history)) data.history=[];
  let mode='pin',moneyMode='add';

  const $=id=>document.getElementById(id);
  function save(){localStorage.setItem(key,JSON.stringify(data));render()}
  function level(n){if(n>=100)return ['💖 最最乖大豬','100+ 枚'];if(n>=50)return ['👑 無敵乖豬','50 - 99 枚'];if(n>=30)return ['🎀 超級乖豬','30 - 49 枚'];if(n>=10)return ['🐷 乖豬豬','10 - 29 枚'];return ['🐣 小乖豬','0 - 9 枚']}
  function render(){
    const n=Math.max(0,Math.floor(Number(data.balance)||0));
    $('balance').textContent=n.toLocaleString('zh-TW');
    const lv=level(n); $('levelName').textContent=lv[0]; $('levelRange').textContent=lv[1];
  }
  function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.classList.remove('show'),1600)}
  function spend(n){n=Math.floor(Number(n));if(!Number.isFinite(n)||n<1)return;if(n>data.balance)return toast('乖豬豬印章不夠喔 🐷');data.history.push(data.balance);data.balance-=n;save();$('encouragement').innerHTML=encouragements[Math.floor(Math.random()*encouragements.length)];toast('已使用 '+n+' 枚印章 🐷')}
  function publicSpend(){const e=$('publicSpend');const n=Math.floor(Number(e.value));if(!Number.isFinite(n)||n<1)return toast('請輸入要使用的印章數');spend(n);if(n<=data.balance+n)e.value=''}
  function undo(){if(!data.history.length)return toast('目前沒有可以取消的操作');data.balance=data.history.pop();save();toast('已取消上一個操作 ↩️')}
  function openPin(){mode='pin';$('mt').textContent='🔐 豬豬管理';$('mp').textContent='請輸入管理密碼';const i=$('modalInput');i.type='password';i.value='';i.placeholder='輸入密碼';$('modal').classList.add('show');setTimeout(()=>i.focus(),80)}
  function openMoney(m){moneyMode=m;mode='money';$('mt').textContent=m==='add'?'💗 補充印章':'🐾 使用印章';$('mp').textContent=m==='add'?'輸入要補充的印章數':'輸入要使用的印章數';const i=$('modalInput');i.type='number';i.inputMode='numeric';i.value='';i.placeholder=m==='add'?'輸入要補充幾枚印章':'輸入要使用幾枚印章';$('modal').classList.add('show');setTimeout(()=>i.focus(),80)}
  function closeModal(){$('modal').classList.remove('show')}
  function confirmModal(){
    const i=$('modalInput');
    if(mode==='pin'){
      if(i.value===ADMIN_PIN){closeModal();toast('管理驗證成功 🔓');openMoney('add')}
      else toast('密碼錯誤，再試一次');
      return;
    }
    const n=Math.floor(Number(i.value));
    if(!Number.isFinite(n)||n<1)return toast('請輸入正確數量');
    if(moneyMode==='spend'&&n>data.balance)return toast('乖豬豬印章不夠喔 🐷');
    data.history.push(data.balance);data.balance += moneyMode==='add'?n:-n;save();closeModal();toast(moneyMode==='add'?'印章補充成功 💗':'印章使用成功 🐷');
  }
  $('manage').addEventListener('click',openPin);
  $('quick1').addEventListener('click',()=>spend(1));
  $('quick5').addEventListener('click',()=>spend(5));
  $('useBtn').addEventListener('click',publicSpend);
  $('publicSpend').addEventListener('keydown',e=>{if(e.key==='Enter')publicSpend()});
  $('addBtn').addEventListener('click',()=>openPin());
  $('undoBtn').addEventListener('click',undo);
  $('confirm').addEventListener('click',confirmModal);
  $('cancel').addEventListener('click',closeModal);
  $('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});
  $('modalInput').addEventListener('keydown',e=>{if(e.key==='Enter')confirmModal();if(e.key==='Escape')closeModal()});
  render();
})();
</script>
</body>
</html>
