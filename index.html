<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff9fba">
<title>🐷 小豬幫幫我！</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#fff0f5 0%,#fff9f6 55%,#ffeef3 100%);font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#593d45;min-height:100vh}.app{max-width:460px;margin:auto;padding:20px 16px 36px;position:relative;overflow:hidden}.top{display:flex;justify-content:space-between;align-items:center}.h{display:flex;gap:11px;align-items:center}.pig{font-size:45px;filter:drop-shadow(0 6px 5px #c85f7a35);animation:wiggle 3s ease-in-out infinite}.top:before,.top:after{content:'🐷';position:fixed;font-size:22px;opacity:.12;z-index:-1}.top:before{left:8px;top:120px;transform:rotate(-18deg)}.top:after{right:7px;top:260px;transform:rotate(16deg)}.title{font-size:25px;font-weight:950;letter-spacing:.5px;color:#6b3947}.sub{font-size:12px;opacity:.58;margin-top:3px}.title:after{content:' ♡';color:#ff759b}.sub{font-size:12px;opacity:.58;margin-top:3px}.sub{font-size:12px;opacity:.58;margin-top:3px}.manage{border:0;background:#fff;border:1px solid #f2d7df;color:#9b6573;border-radius:15px;padding:9px 11px;font-weight:800;font-size:12px;box-shadow:0 5px 15px #b96e8220}.card{margin-top:18px;background:linear-gradient(145deg,#ffb6c9 0%,#ff8eae 48%,#ff6f98 100%);color:#fff;border-radius:34px;padding:24px 23px 22px;box-shadow:0 20px 42px #d8799340;position:relative;overflow:hidden;border:2px solid #fff8;isolation:isolate}.card:before{content:'🐷';position:absolute;right:12px;top:8px;font-size:52px;transform:rotate(8deg);opacity:.95;filter:drop-shadow(0 4px 4px #9e456030)}.card:after{content:'♡  ♡  🐷  ♡  ♡';position:absolute;right:-22px;bottom:-5px;font-size:38px;letter-spacing:5px;opacity:.14;white-space:nowrap}.card .label{display:inline-block;background:#fff3;border:1px solid #fff5;padding:5px 9px;border-radius:999px}.card .name{display:inline-block;background:#fff;color:#d9577e;padding:6px 13px;border-radius:999px;font-size:19px;margin:8px 0 22px;box-shadow:0 5px 12px #a84d6720}.label{font-size:13px;opacity:.9}.name{font-size:24px;font-weight:900;margin:6px 0 22px}.balance-label{font-size:13px;opacity:.9}.balance{font-size:46px;font-weight:950;letter-spacing:.5px;margin-top:2px;text-shadow:0 3px 0 #b94e6d30}.no{font-size:11px;margin-top:19px;opacity:.8}
.card{min-height:255px;padding:22px 22px 20px;background:linear-gradient(145deg,#ffc9d7 0%,#ff9db8 48%,#f9789d 100%);border-radius:36px;box-shadow:0 22px 45px #d8799345;position:relative;overflow:hidden;border:3px solid #fff9;isolation:isolate}
.card:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 18% 20%,#fff7 0 4%,transparent 5%),radial-gradient(circle at 82% 72%,#fff5 0 3%,transparent 4%);opacity:.55;pointer-events:none}
.card:after{content:'';position:absolute;width:230px;height:230px;border-radius:50%;right:-92px;bottom:-125px;background:#ffffff18;box-shadow:-250px -145px 0 10px #ffffff0b;pointer-events:none}
.pig-ear{position:absolute;top:12px;width:72px;height:72px;background:#f487a6;border:4px solid #fff9;border-radius:48% 52% 45% 55%;z-index:1;box-shadow:inset 0 8px 0 #ffffff22}
.ear-l{left:18px;transform:rotate(-27deg)}.ear-r{right:18px;transform:rotate(27deg)}
.ear-l:after,.ear-r:after{content:'';position:absolute;inset:15px;border-radius:50%;background:#e9688d}
.pig-face{position:absolute;right:25px;top:20px;width:135px;height:120px;background:#ffb1c7;border-radius:48% 48% 45% 45%;border:4px solid #fff9;z-index:2;box-shadow:0 9px 18px #a84d6730}
.pig-eyes{position:absolute;left:29px;right:29px;top:35px;display:flex;justify-content:space-between}.pig-eyes i{width:13px;height:18px;background:#593d45;border-radius:50%;display:block;box-shadow:0 1px 0 #fff}
.pig-snout{position:absolute;left:31px;top:62px;width:73px;height:42px;background:#f47f9e;border-radius:50%;border:3px solid #fff8;display:flex;justify-content:space-evenly;align-items:center}.pig-snout span{width:13px;height:18px;background:#a94d68;border-radius:50%}
.pig-blush{position:absolute;top:67px;width:20px;height:11px;background:#ef7293;border-radius:50%;opacity:.55}.blush-l{left:11px}.blush-r{right:11px}
.card-copy{position:relative;z-index:3;max-width:245px}.card .label{display:inline-block;background:#ffffff35;border:1px solid #fff6;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800}.card .name{display:inline-block;background:#fff;color:#d9577e;padding:7px 15px;border-radius:999px;font-size:20px;font-weight:950;margin:9px 0 24px;box-shadow:0 6px 13px #a84d6720}.card .balance-label{font-size:13px;opacity:.9}.card .balance{font-size:43px;font-weight:950;letter-spacing:.5px;margin-top:2px;text-shadow:0 3px 0 #b94e6d30}.card .no{font-size:11px;margin-top:16px;opacity:.8;letter-spacing:1px}.pig-sparkles{position:absolute;left:18px;bottom:9px;color:#fff;font-size:20px;letter-spacing:2px;opacity:.45;z-index:3}

.quick{margin-top:20px;background:#fff7fa;border:1px solid #f5dce4;border-radius:26px;padding:16px 13px 14px;box-shadow:0 10px 26px #bd728310}.quick:before{content:'🐷';margin-right:6px}.quick .section-title{display:inline-block;margin-bottom:13px}.section-title{font-size:16px;font-weight:950;margin:0 0 11px 3px;color:#6b3947}.quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.quick-btn{border:0;background:linear-gradient(180deg,#fff,#fff7f9);border:1px solid #f2d4de;border-radius:19px;padding:14px 5px;color:#a24f68;font-size:16px;font-weight:950;box-shadow:0 7px 18px #bd728315;position:relative}.quick-btn:before{content:'🐽';display:block;font-size:18px;margin-bottom:3px}.quick-btn:nth-child(1){transform:rotate(-1deg)}.quick-btn:nth-child(2){transform:rotate(1deg)}.quick-btn:nth-child(3){transform:rotate(-1deg)}.quick-btn:nth-child(4){transform:rotate(1deg)}.quick-btn:active,.manage:active,.action:active{transform:scale(.97)}.public-note{text-align:center;font-size:12px;opacity:.55;margin:18px 0 0}.public-note:before{content:'✿  '} .public-note:after{content:'  ✿'}.admin{display:none;margin-top:18px;background:#fff;border:1px solid #f0dce2;border-radius:24px;padding:18px;box-shadow:0 8px 24px #bd728315}.admin.show{display:block}.admin-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.admin-title{font-size:17px;font-weight:900}.lock{border:0;background:#f9eef1;color:#865664;border-radius:12px;padding:8px 10px;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.action{border:0;border-radius:17px;padding:15px;font-size:16px;font-weight:900}.add{background:#ffe0e8;color:#df527a}.spend{background:#593d45;color:#fff}.admin-hint{font-size:12px;opacity:.5;margin:12px 2px 0}.modal{display:none;position:fixed;inset:0;background:#6b394755;backdrop-filter:blur(4px);align-items:flex-end;padding:14px;z-index:10}.modal.show{display:flex}.sheet{width:100%;max-width:460px;margin:auto;background:linear-gradient(180deg,#fffafb,#fff);border:2px solid #f8dce5;border-radius:30px;padding:22px;box-shadow:0 -10px 35px #3e283525}.sheet:before{content:'🐷';display:block;text-align:center;font-size:42px;margin-bottom:2px}.sheet-icon{font-size:30px;text-align:center}.sheet-icon{display:none}.sheet h2{margin:6px 0 5px}.sheet p{margin:0 0 15px;font-size:13px;opacity:.55}.input{width:100%;padding:15px;border:2px solid #f0d5de;border-radius:18px;font-size:18px;outline:none;background:#fffafb}.input:focus{border-color:#ff91ad;box-shadow:0 0 0 4px #ff91ad18}.input:focus{border-color:#ff91ad}.confirm,.cancel{width:100%;border:0;border-radius:16px;padding:15px;font-size:16px;font-weight:900;margin-top:10px}.confirm{background:#ff6f98;color:#fff}.cancel{background:#f7eef1;color:#593d45}.pin{letter-spacing:5px;text-align:center}@keyframes wiggle{0%,100%{transform:rotate(0)}50%{transform:rotate(-5deg)}}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%) translateY(20px);background:#593d45;color:#fff;padding:11px 16px;border-radius:14px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:20}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.pig-info{margin-top:14px;display:grid;gap:10px}.level-box,.encourage{background:#fff;border:1px solid #f2dbe2;border-radius:22px;padding:15px 17px;box-shadow:0 8px 22px #bd728310}.info-title{font-size:13px;color:#9b6573;font-weight:900}.level{font-size:21px;font-weight:950;color:#6b3947;margin-top:4px}.level-desc{font-size:12px;opacity:.55;margin-top:3px}.encourage{text-align:center;background:linear-gradient(180deg,#fff8fa,#fff);font-size:14px;font-weight:850;color:#a24f68}.quick-btn{min-height:68px}.quick-btn:before{content:'🐷';display:block;font-size:18px;margin-bottom:3px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="h"><div class="pig">🐷</div><div><div class="title">小豬幫幫我！</div><div class="sub">NFC 感應即可查看大豬卡片</div></div></div>
    <button class="manage" onclick="openPin()">🔐 豬豬管理</button>
  </div>

  <div class="card">
    <div class="pig-ear ear-l"></div><div class="pig-ear ear-r"></div>
    <div class="pig-face">
      <div class="pig-eyes"><i></i><i></i></div>
      <div class="pig-blush blush-l"></div><div class="pig-blush blush-r"></div>
      <div class="pig-snout"><span></span><span></span></div>
    </div>
    <div class="card-copy">
      <div class="label">🐷 我的豬豬卡</div>
      <div class="name">大豬</div>
      <div class="balance-label">目前乖豬豬印章</div>
      <div class="balance" id="balance">$0</div>
      <div class="no" id="no"></div>
    </div>
    <div class="pig-sparkles">♡　♡　♡</div>
  </div>

  <div class="quick">
    <div class="section-title">快速使用印章</div>
    <div class="quick-grid">
      <button class="quick-btn" onclick="quickSpend(1)">-1 印章</button>
      <button class="quick-btn" onclick="quickSpend(5)">-5 印章</button>
    </div>
  </div>

  <div class="pig-info">
    <div class="level-box">
      <div class="info-title">🎀 乖豬豬等級</div>
      <div class="level" id="level">🐣 小乖豬</div>
      <div class="level-desc" id="levelDesc">再集幾枚印章，就會升級囉！</div>
    </div>
    <div class="encourage" id="encourage">🐷 大豬今天也很乖！</div>
  </div>

  <div class="admin" id="admin">
    <div class="admin-head"><div class="admin-title">🔐 豬豬管理</div><button class="lock" onclick="logout()">鎖定</button></div>
    <div class="actions">
      <button class="action add" onclick="openMoney('add')">💗 補充印章</button>
      <button class="action spend" onclick="openMoney('spend')">🐾 使用印章</button>
    </div>
    <div class="admin-hint">只有輸入管理密碼後，才會顯示補充印章與自訂使用功能。</div>
  </div>
  <div class="public-note">需要管理功能？點右上角「🔐 豬豬管理」</div>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <div class="sheet-icon" id="mi">🔐</div>
    <h2 id="mt">管理員驗證</h2>
    <p id="mp">請輸入管理密碼</p>
    <input class="input pin" id="input" type="password" inputmode="numeric" maxlength="32" placeholder="輸入密碼">
    <button class="confirm" onclick="confirmModal()">確認</button>
    <button class="cancel" onclick="closeModal()">取消</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const c=(location.pathname.match(/card\/([^/]+)/)||[])[1]||new URLSearchParams(location.search).get('card')||'001';
const key='pig_'+c;
// 這是前端展示用的簡易管理密碼；若要多人使用/正式商用，之後應改成雲端驗證。
const ADMIN_PIN='smallpig0926';
let d=JSON.parse(localStorage.getItem(key)||'null')||{name:'大豬',balance:850};
let modalMode='pin',moneyMode='add';

function money(n){return Number(n).toLocaleString('zh-TW')+' 枚'}
function getLevel(n){
  if(n>=100)return ['💖 最最乖大豬','已經是最高級的乖豬豬了！'];
  if(n>=50)return ['👑 無敵乖豬','大豬正在朝最最乖前進！'];
  if(n>=30)return ['🎀 超級乖豬','大豬越來越乖了！'];
  if(n>=10)return ['🐷 乖豬豬','繼續累積乖乖印章吧！'];
  return ['🐣 小乖豬','再集幾枚印章，就會升級囉！'];
}
const encouragements=['🐷 大豬今天也很乖！','💕 大豬乖乖，繼續保持！','🎀 這枚印章是給乖乖的大豬！','✨ 大豬表現得很好喔！','🐽 乖豬豬認證成功！','💗 大豬又完成一件乖乖的事了！'];
function render(){
  document.getElementById('balance').textContent=money(d.balance);
  document.getElementById('no').textContent='CARD-'+c;
  const lv=getLevel(d.balance);
  document.getElementById('level').textContent=lv[0];
  document.getElementById('levelDesc').textContent=lv[1];
}
function save(){localStorage.setItem(key,JSON.stringify(d));render()}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}
function openPin(){modalMode='pin';document.getElementById('mi').textContent='🔐';document.getElementById('mt').textContent='管理員驗證';document.getElementById('mp').textContent='請輸入管理密碼';document.getElementById('input').type='password';document.getElementById('input').inputMode='text';document.getElementById('input').value='';document.getElementById('modal').classList.add('show');setTimeout(()=>document.getElementById('input').focus(),100)}
function openMoney(mode){moneyMode=mode;modalMode='money';document.getElementById('mi').textContent=mode==='add'?'💰':'🛍️';document.getElementById('mt').textContent=mode==='add'?'💗 補充印章':'🐾 使用印章';document.getElementById('mp').textContent=mode==='add'?'輸入要補充的印章數':'輸入要使用的印章數';document.getElementById('input').type='number';document.getElementById('input').inputMode='decimal';document.getElementById('input').value='';document.getElementById('modal').classList.add('show');setTimeout(()=>document.getElementById('input').focus(),100)}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function confirmModal(){const input=document.getElementById('input');const value=Number(input.value);if(modalMode==='pin'){if(input.value===ADMIN_PIN){closeModal();document.getElementById('admin').classList.add('show');sessionStorage.setItem('pig_admin_'+c,'1');showToast('管理模式已開啟 🔓')}else{showToast('密碼錯誤，再試一次')}}else{if(!value||value<=0){showToast('請輸入金額');return}if(moneyMode==='spend'&&value>d.balance){showToast('乖豬豬印章不夠喔 🐷');return}d.balance+=moneyMode==='add'?value:-value;save();closeModal();showToast(moneyMode==='add'?'印章補充成功 💗':'印章使用成功 🐷')}}
function logout(){document.getElementById('admin').classList.remove('show');sessionStorage.removeItem('pig_admin_'+c);showToast('已鎖定 🔒')}
function quickSpend(n){if(n>d.balance){showToast('乖豬豬印章不夠喔 🐷');return}d.balance-=n;save();document.getElementById('encourage').textContent=encouragements[Math.floor(Math.random()*encouragements.length)];showToast('已使用 '+money(n)+' 🐷')}
if(sessionStorage.getItem('pig_admin_'+c)==='1')document.getElementById('admin').classList.add('show');
render();
</script>
</body>
</html>
