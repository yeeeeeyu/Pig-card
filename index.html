<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff9fba"><title>🐷 小豬幫幫我！</title><style>body{margin:0;background:linear-gradient(#fff0f4,#fffaf8);font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#593d45}.app{max-width:460px;margin:auto;padding:22px 18px}.h{display:flex;gap:12px;align-items:center}.pig{font-size:42px}.title{font-size:24px;font-weight:800}.sub{font-size:12px;opacity:.6}.card{margin-top:18px;background:linear-gradient(135deg,#ff9fba,#ffcad8);color:#fff;border-radius:28px;padding:25px;box-shadow:0 14px 30px #d8799333}.name{font-size:23px;font-weight:800;margin:7px 0 18px}.balance{font-size:42px;font-weight:900}.no{font-size:12px;margin-top:18px;opacity:.85}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.btn{border:0;border-radius:18px;padding:16px;font-size:16px;font-weight:800}.add{background:#fff;color:#e85f86}.spend{background:#593d45;color:#fff}.panel{background:#fff;border:1px solid #f1dce2;border-radius:22px;padding:18px}.tx{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f6eaed}.tx:last-child{border:0}.plus{color:#e85f86;font-weight:800}.modal{display:none;position:fixed;inset:0;background:#3e283555;align-items:end;padding:14px}.modal.show{display:flex}.sheet{width:100%;max-width:460px;margin:auto;background:#fff;border-radius:26px;padding:22px}.input{width:100%;padding:15px;border:1px solid #ead6dc;border-radius:15px;font-size:18px;box-sizing:border-box}.confirm{width:100%;margin-top:12px;background:#ff6f98;color:#fff}.cancel{width:100%;margin-top:8px;background:#f7eef1;color:#593d45}</style></head><body><div class="app"><div class="h"><div class="pig">🐷</div><div><div class="title">小豬幫幫我！</div><div class="sub">NFC 感應即可查看卡片</div></div></div><div class="card"><div>目前卡片</div><div class="name" id="name">大豬</div><div>剩餘豬豬幣</div><div class="balance" id="balance">$0</div><div class="no" id="no"></div></div><div class="actions"><button class="btn add" onclick="openM('add')">＋ 儲值</button><button class="btn spend" onclick="openM('spend')">－ 扣款</button></div><div class="panel"><h3>📜 交易紀錄</h3><div id="history"></div></div></div><div class="modal" id="modal"><div class="sheet"><h2 id="mt">儲值</h2><input class="input" id="amt" type="number" min="1" placeholder="輸入金額"><button class="btn confirm" onclick="ok()">確認</button><button class="btn cancel" onclick="closeM()">取消</button></div></div><script>const c=(location.pathname.match(/card\/([^/]+)/)||[])[1]||new URLSearchParams(location.search).get('card')||'001',key='pig_'+c;let d=JSON.parse(localStorage.getItem(key)||'null')||{name:'大豬',balance:850,history:[{t:'儲值',a:500},{t:'消費',a:-150}]};let act='add';function money(n){return '$'+n.toLocaleString('zh-TW')}function render(){balance.textContent=money(d.balance);no.textContent='CARD-'+c;history.innerHTML=d.history.length?d.history.map(x=>`<div class="tx"><span>${x.t}</span><span class="${x.a>0?'plus':''}">${x.a>0?'+':''}${money(Math.abs(x.a))}</span></div>`).join(''):'尚無紀錄'}function openM(a){act=a;mt.textContent=a==='add'?'💰 儲值':'🛍️ 扣款';amt.value='';modal.classList.add('show');amt.focus()}function closeM(){modal.classList.remove('show')}function ok(){let n=+amt.value;if(!n)return alert('請輸入金額');if(act==='spend'&&n>d.balance)return alert('餘額不足');d.balance+=act==='add'?n:-n;d.history.unshift({t:act==='add'?'儲值':'消費',a:act==='add'?n:-n});localStorage.setItem(key,JSON.stringify(d));closeM();render()}render();</script></body></html>
